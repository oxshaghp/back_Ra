version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: freelancer_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: freelancer_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelancer_network
    command: --default-authentication-plugin=mysql_native_password

  # Optional: phpMyAdmin for database management (like Adminer)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: freelancer_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - freelancer_network

volumes:
  mysql_data:
    driver: local

networks:
  freelancer_network:
    driver: bridge
